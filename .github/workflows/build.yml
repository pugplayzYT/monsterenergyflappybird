name: Build Monster Energy Flappy Bird

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-native-aot:
    name: Windows x64 Native AOT
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Convert SVG assets to PNG
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inkscape = 'C:\Program Files\Inkscape\bin\inkscape.com'
          if (!(Test-Path $inkscape)) {
            choco install inkscape -y --no-progress
          }
          if (!(Test-Path $inkscape)) {
            Write-Host 'Inkscape bin directory:'
            Get-ChildItem 'C:\Program Files\Inkscape\bin' -ErrorAction SilentlyContinue | Select-Object Name,Length
            throw 'Inkscape console executable was not found after installation.'
          }

          & $inkscape --version
          if ($LASTEXITCODE -ne 0) { throw "Inkscape CLI test failed with exit code $LASTEXITCODE" }

          foreach ($svg in Get-ChildItem assets -Filter *.svg) {
            $png = [System.IO.Path]::ChangeExtension($svg.FullName, '.png')
            Write-Host "Converting $($svg.FullName) -> $png"
            & $inkscape $svg.FullName "--export-filename=$png" --export-type=png
            $code = $LASTEXITCODE
            if ($code -ne 0) { throw "Inkscape exited with code $code for $($svg.Name)" }
            if (!(Test-Path -LiteralPath $png)) {
              Write-Host 'Asset directory after failed conversion:'
              Get-ChildItem assets -Force | Select-Object Name,Length,FullName
              throw "PNG conversion produced no file for $($svg.Name)"
            }
            if ((Get-Item -LiteralPath $png).Length -le 0) { throw "PNG output is empty for $($svg.Name)" }
          }
          Get-ChildItem assets | Format-Table Name,Length

      - name: Restore
        run: dotnet restore MonsterEnergyFlappyBird.csproj -r win-x64

      - name: Publish Native AOT
        run: dotnet publish MonsterEnergyFlappyBird.csproj -c Release -r win-x64 --self-contained true -o dist

      - name: Verify executable and PNG assets
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/MonsterEnergyFlappyBird.exe')) { throw 'Native AOT EXE was not produced.' }
          foreach ($asset in 'background','can','pipe','gameover') {
            $path = "dist/assets/$asset.png"
            if (!(Test-Path $path)) { throw "Missing required PNG asset: $asset.png" }
            if ((Get-Item $path).Length -le 0) { throw "PNG asset is empty: $asset.png" }
          }
          Get-ChildItem dist -Recurse | Format-Table FullName,Length

      - name: Package clean Windows build
        shell: pwsh
        run: Compress-Archive -Path 'dist/*' -DestinationPath 'MonsterEnergyFlappyBird-win-x64.zip' -Force

      - name: Upload runnable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonsterEnergyFlappyBird-win-x64
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" 'MonsterEnergyFlappyBird-win-x64.zip' --title "Monster Energy Flappy Bird ${{ github.ref_name }}" --generate-notes
